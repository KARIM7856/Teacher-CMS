org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# All required SDK packages (platforms 34/35/36, build-tools 36, NDK, platform-tools)
# are installed locally. Disable AGP's remote SDK auto-download so the build never
# probes Google's repo — that probe hangs behind Avast's TLS interception here.
android.builder.sdkDownload=false
# Kotlin's incremental compiler stores relocatable (relative) source paths, which
# throws "different roots" on Windows when the project drive (D:) differs from the
# pub cache drive (C:). Disabling incremental compilation sidesteps it. Harmless
# cross-platform — it only affects rebuild speed, not correctness.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
